services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: bhoomi
      POSTGRES_DB: bhoomisync
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bhoomi -d bhoomisync"]  # TCP: not ready during init phase
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
